<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc">
  <title id="title">Perception → decision → action</title>
  <desc id="desc">HomePulse Vision agent workflow. A doorbell event triggers capture_snapshot and analyze_frame (OpenCV 5). If the frame fails the quality gate and no pass was decoded, the agent retries with improve_view or request_new_snapshot (at most 3 attempts; OpenCV output picks the operation). A decoded HomePulse pass QR goes to verify_pass; a valid pass reaches the deterministic unlock guard and unlock_door is ALLOWED, an invalid one is BLOCKED and the family is notified. Instruction-like text, a non-pass QR, a person without a pass or a still-unclear frame leads to ask_family; the door stays locked until the family approves (HMAC-signed approval for this session reaches the guard) or declines (BLOCKED).</desc>
  <defs>
    <style><![CDATA[
    text { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .t, .el { font-size: 13px; }
    .el { fill: #3d444d; }
    .tb { font-size: 14px; font-weight: 600; }
    .tbx { font-size: 15px; font-weight: 700; }
    .ts { font-size: 12px; fill: #57606a; }
    .m, .elm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12.5px; }
    .elm { fill: #3d444d; }
    .mb { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; font-weight: 600; }
    .h1 { font-size: 22px; font-weight: 700; }
    .h2 { font-size: 14px; fill: #57606a; }
    .gl { font-size: 14px; font-weight: 700; }
    .c-cv { fill: #0f4d43; }
    .c-aws { fill: #8f4800; }
    .c-llm { fill: #4a2f9e; }
    .c-sec { fill: #8f1b12; }
    .c-ok { fill: #17603a; }
    .c-mut { fill: #57606a; }
    rect, polygon { stroke-width: 1.5; }
    .bg { fill: #ffffff; stroke: none; }
    .cv { fill: #e3f1ee; stroke: #146356; }
    .cvs { fill: #ffffff; stroke: #146356; stroke-width: 1.2; }
    .aws { fill: #fff1e0; stroke: #b65c00; }
    .awsg { fill: #fffaf4; stroke: #b65c00; }
    .lam { fill: #ffffff; stroke: #b65c00; stroke-width: 2; }
    .llm { fill: #efeaff; stroke: #5b3fb8; }
    .llmc { fill: #ffffff; stroke: #5b3fb8; stroke-width: 1.2; }
    .sec { fill: #fdecea; stroke: #b42318; }
    .secd { fill: #fdecea; stroke: #b42318; stroke-dasharray: 6 4; }
    .sim { fill: #fafafa; stroke: #666666; stroke-dasharray: 6 4; }
    .app { fill: #f6f8fa; stroke: #57606a; }
    .ok { fill: #e5f4ea; stroke: #1e7a46; }
    .note { fill: #f6f8fa; stroke: #d0d7de; }
    .lane-p { fill: #f3f9f7; stroke: none; }
    .lane-d { fill: #f7f5ff; stroke: none; }
    .lane-a { fill: #f6f7f8; stroke: none; }
    .lh-p { fill: #e3f1ee; stroke: #146356; }
    .lh-d { fill: #efeaff; stroke: #5b3fb8; }
    .lh-a { fill: #eef0f2; stroke: #57606a; }
    .div { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .ar { fill: none; stroke: #3d444d; stroke-width: 1.5; }
    .arp { fill: none; stroke: #5b3fb8; stroke-width: 1.8; }
    .arr { fill: none; stroke: #b42318; stroke-width: 1.5; }
    .arg { fill: none; stroke: #1e7a46; stroke-width: 1.8; }
    .ln { fill: none; stroke: #8c959f; stroke-width: 1.5; }
    ]]></style>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="ah-s" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3d444d"/></marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fb8"/></marker>
    <marker id="ahp-s" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5b3fb8"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
    <marker id="ahr-s" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#b42318"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e7a46"/></marker>
    <marker id="ahg-s" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1e7a46"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1150" fill="#ffffff"/>

  <!-- Title -->
  <text x="24" y="40" class="h1">Perception → decision → action</text>
  <text x="24" y="64" class="h2">How OpenCV 5 output changes the agent's next step, and why the lock decision stays deterministic</text>

  <!-- Swimlanes (column headers) -->
  <g>
    <rect x="16" y="84" width="274" height="446" rx="10" class="lane-p"/>
    <g>
      <rect x="16" y="84" width="274" height="34" rx="10" class="lh-p"/>
      <text x="153" y="106" class="gl c-cv" text-anchor="middle">Perception (OpenCV 5)</text>
    </g>
  </g>
  <g>
    <rect x="298" y="84" width="588" height="1046" rx="10" class="lane-d"/>
    <g>
      <rect x="298" y="84" width="588" height="34" rx="10" class="lh-d"/>
      <text x="592" y="106" class="gl c-llm" text-anchor="middle">Decision (Nova 2 Lite + deterministic checks)</text>
    </g>
  </g>
  <g>
    <rect x="894" y="84" width="290" height="1046" rx="10" class="lane-a"/>
    <g>
      <rect x="894" y="84" width="290" height="34" rx="10" class="lh-a"/>
      <text x="1039" y="106" class="gl c-mut" text-anchor="middle">Action (tools, human approval)</text>
    </g>
  </g>

  <!-- 1. Doorbell event -> capture_snapshot -> analyze_frame -->
  <g>
    <rect x="959" y="134" width="160" height="36" rx="18" class="app"/>
    <text x="1039" y="157" class="tb" text-anchor="middle">Doorbell event</text>
  </g>
  <g>
    <rect x="929" y="194" width="220" height="54" rx="8" class="sim"/>
    <text x="1039" y="216.7" class="mb" text-anchor="middle">capture_snapshot</text>
    <text x="1039" y="234.7" class="t" text-anchor="middle">simulated camera · frame burst</text>
  </g>
  <g>
    <rect x="28" y="184" width="240" height="74" rx="8" class="cv"/>
    <text x="148" y="207.7" class="mb" text-anchor="middle">analyze_frame</text>
    <text x="148" y="225.7" class="t" text-anchor="middle">OpenCV 5: quality gate, QR,</text>
    <text x="148" y="243.7" class="t" text-anchor="middle">text (DNN), presence (YuNet)</text>
  </g>
  <text x="600" y="213" class="el" text-anchor="middle">frames</text>
  <text x="410" y="282" class="el" text-anchor="middle">measurements, not pixels</text>

  <!-- 2. Quality gate and retry loop -->
  <g>
    <polygon points="500,316 618,370 500,424 382,370" class="llm" stroke-linejoin="round"/>
    <text x="500" y="366" class="tb" text-anchor="middle">frame trustworthy?</text>
    <text x="500" y="384.2" class="t" text-anchor="middle">(quality gate)</text>
  </g>
  <g id="retry-loop">
    <rect x="28" y="330" width="240" height="184" rx="10" class="cvs"/>
    <text x="148" y="352" class="tb c-cv" text-anchor="middle">Retry loop · ≤ 3 attempts</text>
    <text x="148" y="370" class="t" text-anchor="middle">OpenCV output picks the op</text>
    <g>
      <rect x="40" y="384" width="216" height="52" rx="8" class="cv"/>
      <text x="148" y="405.7" class="mb" text-anchor="middle">improve_view</text>
      <text x="148" y="423.7" class="t" text-anchor="middle">crop_upscale / gamma / CLAHE</text>
    </g>
    <text x="148" y="454" class="ts" text-anchor="middle">or</text>
    <g>
      <rect x="40" y="464" width="216" height="36" rx="8" class="sim"/>
      <text x="148" y="486.7" class="mb" text-anchor="middle">request_new_snapshot</text>
    </g>
  </g>
  <text x="348" y="344" class="el" text-anchor="middle">no, and no</text>
  <text x="348" y="359" class="el" text-anchor="middle">pass decoded</text>
  <text x="90" y="300" class="el">retry</text>
  <text x="512" y="442" class="el">yes, or a pass was decoded,</text>
  <text x="512" y="458" class="el">or attempts are used up</text>

  <!-- 3. HomePulse pass path -->
  <g>
    <polygon points="500,468 610,520 500,572 390,520" class="llm" stroke-linejoin="round"/>
    <text x="500" y="515.5" class="tb" text-anchor="middle">HomePulse pass</text>
    <text x="500" y="534.5" class="tb" text-anchor="middle">QR decoded?</text>
  </g>
  <text x="510" y="593" class="el">yes</text>
  <g>
    <rect x="390" y="606" width="220" height="70" rx="8" class="sec"/>
    <text x="500" y="627.7" class="mb" text-anchor="middle">verify_pass</text>
    <text x="500" y="645.7" class="t" text-anchor="middle">Ed25519 · window ·</text>
    <text x="500" y="663.7" class="t" text-anchor="middle">freshness · one-time</text>
  </g>
  <g>
    <polygon points="500,706 575,748 500,790 425,748" class="sec" stroke-linejoin="round"/>
    <text x="500" y="753" class="tb" text-anchor="middle">valid?</text>
  </g>
  <text x="510" y="814" class="el">yes</text>
  <g>
    <rect x="380" y="830" width="240" height="74" rx="8" class="sec"/>
    <text x="500" y="854" class="tb" text-anchor="middle">Unlock guard</text>
    <text x="500" y="872.2" class="t" text-anchor="middle">verified pass seen in this</text>
    <text x="500" y="890.2" class="t" text-anchor="middle">session, or family approval</text>
  </g>
  <text x="380" y="740" class="el" text-anchor="middle">no</text>
  <text x="624" y="1080" class="el c-sec" text-anchor="middle">forged · expired · stale_display · reused</text>

  <!-- 4-5. Untrusted text / unclear scene -> ask_family -->
  <text x="629" y="512" class="el" text-anchor="middle">no</text>
  <g>
    <polygon points="762,456 876,520 762,584 648,520" class="llm" stroke-linejoin="round"/>
    <text x="762" y="506" class="tb" text-anchor="middle">instruction-like</text>
    <text x="762" y="525" class="tb" text-anchor="middle">text or</text>
    <text x="762" y="544" class="tb" text-anchor="middle">non-pass QR?</text>
  </g>
  <text x="908" y="512" class="el" text-anchor="middle">yes</text>
  <text x="772" y="600" class="el">no</text>
  <g>
    <rect x="652" y="606" width="220" height="56" rx="8" class="llmc"/>
    <text x="762" y="629.7" class="t" text-anchor="middle">person present without pass,</text>
    <text x="762" y="647.7" class="t" text-anchor="middle">or frame still unclear</text>
  </g>
  <g>
    <rect x="929" y="604" width="220" height="60" rx="8" class="app"/>
    <text x="1039" y="629.7" class="mb" text-anchor="middle">ask_family</text>
    <text x="1039" y="647.7" class="t" text-anchor="middle">text quoted as untrusted</text>
  </g>
  <g>
    <rect x="929" y="704" width="220" height="56" rx="28" class="app"/>
    <text x="1039" y="727.7" class="mb" text-anchor="middle">ASKED_FAMILY</text>
    <text x="1039" y="745.7" class="t" text-anchor="middle">door stays locked</text>
  </g>

  <!-- 6. Human approval branch -->
  <g>
    <rect x="929" y="836" width="220" height="62" rx="8" class="sim"/>
    <text x="1039" y="863" class="tb" text-anchor="middle">Family phone</text>
    <text x="1039" y="881.2" class="t" text-anchor="middle">Approve / Decline</text>
  </g>
  <text x="775" y="838" class="el" text-anchor="middle">Approve · HMAC-signed approval</text>
  <text x="775" y="855" class="el" text-anchor="middle">for this session</text>
  <text x="1121" y="985" class="el">Decline</text>

  <!-- Outcomes -->
  <g>
    <rect x="911" y="966" width="170" height="68" rx="8" class="ok"/>
    <text x="996" y="987" class="tb c-ok" text-anchor="middle">ALLOWED</text>
    <text x="996" y="1005.2" class="mb" text-anchor="middle">unlock_door</text>
    <text x="996" y="1023.2" class="t" text-anchor="middle">(simulated lock)</text>
  </g>
  <g>
    <rect x="911" y="1060" width="240" height="56" rx="8" class="sec"/>
    <text x="1031" y="1084" class="tb c-sec" text-anchor="middle">BLOCKED</text>
    <text x="1031" y="1102.2" class="t" text-anchor="middle">family notified</text>
  </g>

  <!-- 7. Fail-safe -->
  <g>
    <rect x="16" y="560" width="274" height="100" rx="8" class="secd"/>
    <text x="153" y="588" class="tb c-sec" text-anchor="middle">Fail-safe</text>
    <text x="153" y="606.2" class="t" text-anchor="middle">model error, timeout or step limit</text>
    <text x="153" y="624.2" class="t" text-anchor="middle">→ door stays locked,</text>
    <text x="153" y="642.2" class="t" text-anchor="middle">safety-net family notice</text>
  </g>

  <!-- 8. Who decides -->
  <g>
    <rect x="16" y="680" width="274" height="160" rx="8" class="note"/>
    <text x="30" y="704" class="tb">Who decides?</text>
    <text x="30" y="726" class="t"><tspan class="t">Nova 2 Lite chooses each tool</tspan></text>
    <text x="30" y="744" class="t"><tspan class="t">call from OpenCV measurements;</tspan></text>
    <text x="30" y="762" class="t"><tspan class="t">the guard, not the model,</tspan></text>
    <text x="30" y="780" class="t"><tspan class="t">decides if the lock opens.</tspan></text>
    <text x="30" y="798" class="t"><tspan class="t">Model arguments to </tspan><tspan class="m">unlock_door</tspan></text>
    <text x="30" y="816" class="t"><tspan class="t">are logged, never consulted.</tspan></text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <rect x="16" y="860" width="274" height="188" rx="8" class="note"/>
    <text x="30" y="884" class="tb">Legend</text>
    <rect x="30" y="899" width="22" height="13" rx="3" class="cv"/>
    <text x="62" y="910" class="t">OpenCV 5 perception</text>
    <rect x="30" y="921" width="22" height="13" rx="3" class="llm"/>
    <text x="62" y="932" class="t">Nova 2 Lite decision</text>
    <rect x="30" y="943" width="22" height="13" rx="3" class="sec"/>
    <text x="62" y="954" class="t">Deterministic check</text>
    <rect x="30" y="965" width="22" height="13" rx="3" class="app"/>
    <text x="62" y="976" class="t">Tool call / state</text>
    <rect x="30" y="987" width="22" height="13" rx="3" class="sim"/>
    <text x="62" y="998" class="t">Simulated device</text>
    <rect x="30" y="1009" width="22" height="13" rx="3" class="ok"/>
    <text x="62" y="1020" class="t">Door unlocked</text>
  </g>

  <!-- Connectors (drawn last so they sit above container fills) -->
  <g id="connectors">
    <path d="M1039,170 V194" class="ar" marker-end="url(#ah)"/>
    <path d="M929,221 H268" class="ar" marker-end="url(#ah)"/>
    <path d="M220,258 V290 H500 V316" class="ar" marker-end="url(#ah)"/>
    <path d="M382,370 H268" class="ar" marker-end="url(#ah)"/>
    <path d="M80,330 V258" class="ar" marker-end="url(#ah)"/>
    <path d="M500,424 V468" class="ar" marker-end="url(#ah)"/>
    <path d="M500,572 V606" class="ar" marker-end="url(#ah)"/>
    <path d="M500,676 V706" class="ar" marker-end="url(#ah)"/>
    <path d="M500,790 V830" class="ar" marker-end="url(#ah)"/>
    <path d="M425,748 H336 V1088 H911" class="arr" marker-end="url(#ahr)"/>
    <path d="M500,904 V1000 H911" class="arg" marker-end="url(#ahg)"/>
    <path d="M610,520 H648" class="ar" marker-end="url(#ah)"/>
    <path d="M876,520 H1039 V604" class="ar" marker-end="url(#ah)"/>
    <path d="M762,584 V606" class="ar" marker-end="url(#ah)"/>
    <path d="M872,634 H929" class="ar" marker-end="url(#ah)"/>
    <path d="M1039,664 V704" class="ar" marker-end="url(#ah)"/>
    <path d="M1039,760 V836" class="ar" marker-end="url(#ah)"/>
    <path d="M929,867 H620" class="ar" marker-end="url(#ah)"/>
    <path d="M1113,898 V1060" class="arr" marker-end="url(#ahr)"/>
  </g>
</svg>
