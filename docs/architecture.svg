<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
  <title id="title">HomePulse Vision · architecture</title>
  <desc id="desc">A browser calls a public Lambda Function URL. One arm64 Lambda container runs FastAPI, the OpenCV 5 perception pipeline, the Nova 2 Lite tool-use agent loop, the deterministic pass verifier and unlock guard, and the simulated camera, lock and family phone. The agent sends only measurements and tool results to Amazon Bedrock, never pixels.</desc>
  <defs>
    <style><![CDATA[
    text { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .t, .el { font-size: 13px; }
    .el { fill: #3d444d; }
    .tb { font-size: 14px; font-weight: 600; }
    .tbx { font-size: 15px; font-weight: 700; }
    .ts { font-size: 12px; fill: #57606a; }
    .m, .elm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12.5px; }
    .elm { fill: #3d444d; }
    .mb { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; font-weight: 600; }
    .h1 { font-size: 22px; font-weight: 700; }
    .h2 { font-size: 14px; fill: #57606a; }
    .gl { font-size: 14px; font-weight: 700; }
    .c-cv { fill: #0f4d43; }
    .c-aws { fill: #8f4800; }
    .c-llm { fill: #4a2f9e; }
    .c-sec { fill: #8f1b12; }
    .c-ok { fill: #17603a; }
    .c-mut { fill: #57606a; }
    rect, polygon { stroke-width: 1.5; }
    .bg { fill: #ffffff; stroke: none; }
    .cv { fill: #e3f1ee; stroke: #146356; }
    .cvs { fill: #ffffff; stroke: #146356; stroke-width: 1.2; }
    .aws { fill: #fff1e0; stroke: #b65c00; }
    .awsg { fill: #fffaf4; stroke: #b65c00; }
    .lam { fill: #ffffff; stroke: #b65c00; stroke-width: 2; }
    .llm { fill: #efeaff; stroke: #5b3fb8; }
    .llmc { fill: #ffffff; stroke: #5b3fb8; stroke-width: 1.2; }
    .sec { fill: #fdecea; stroke: #b42318; }
    .secd { fill: #fdecea; stroke: #b42318; stroke-dasharray: 6 4; }
    .sim { fill: #fafafa; stroke: #666666; stroke-dasharray: 6 4; }
    .app { fill: #f6f8fa; stroke: #57606a; }
    .ok { fill: #e5f4ea; stroke: #1e7a46; }
    .note { fill: #f6f8fa; stroke: #d0d7de; }
    .lane-p { fill: #f3f9f7; stroke: none; }
    .lane-d { fill: #f7f5ff; stroke: none; }
    .lane-a { fill: #f6f7f8; stroke: none; }
    .lh-p { fill: #e3f1ee; stroke: #146356; }
    .lh-d { fill: #efeaff; stroke: #5b3fb8; }
    .lh-a { fill: #eef0f2; stroke: #57606a; }
    .div { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .ar { fill: none; stroke: #3d444d; stroke-width: 1.5; }
    .arp { fill: none; stroke: #5b3fb8; stroke-width: 1.8; }
    .arr { fill: none; stroke: #b42318; stroke-width: 1.5; }
    .arg { fill: none; stroke: #1e7a46; stroke-width: 1.8; }
    .ln { fill: none; stroke: #8c959f; stroke-width: 1.5; }
    ]]></style>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="ah-s" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3d444d"/></marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fb8"/></marker>
    <marker id="ahp-s" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5b3fb8"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
    <marker id="ahr-s" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#b42318"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e7a46"/></marker>
    <marker id="ahg-s" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1e7a46"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1100" fill="#ffffff"/>

  <!-- Title -->
  <text x="24" y="40" class="h1">HomePulse Vision · architecture</text>
  <text x="24" y="64" class="h2">One Lambda container: OpenCV 5 perception, a Nova 2 Lite tool-use agent, and a deterministic unlock guard</text>

  <!-- Client -->
  <g>
    <rect x="618" y="86" width="180" height="42" rx="8" class="app"/>
    <text x="708" y="112" class="tb" text-anchor="middle">Browser (judges)</text>
  </g>
  <text x="718" y="149" class="el">HTTPS</text>

  <!-- AWS account / region -->
  <g id="aws">
    <rect x="16" y="156" width="1168" height="824" rx="12" class="awsg"/>
    <text x="32" y="181" class="gl c-aws">AWS · us-east-1</text>

    <!-- Top row: IAM role, Function URL, Budgets -->
    <g>
      <rect x="32" y="196" width="320" height="72" rx="8" class="aws"/>
      <text x="192" y="219" class="tb" text-anchor="middle">IAM execution role</text>
      <text x="192" y="237.2" class="t" text-anchor="middle">bedrock:InvokeModel (Nova 2 Lite only)</text>
      <text x="192" y="255.2" class="t" text-anchor="middle">+ own log group only</text>
    </g>
    <g>
      <rect x="588" y="196" width="240" height="72" rx="8" class="aws"/>
      <text x="708" y="228" class="tb" text-anchor="middle">Lambda Function URL</text>
      <text x="708" y="246.2" class="t" text-anchor="middle">public, auth NONE</text>
    </g>
    <g>
      <rect x="968" y="196" width="200" height="72" rx="8" class="aws"/>
      <text x="1068" y="228" class="tb" text-anchor="middle">AWS Budgets alarm</text>
      <text x="1068" y="246.2" class="t" text-anchor="middle">$10/month</text>
    </g>

    <!-- Lambda function (container image) -->
    <g id="lambda">
      <rect x="32" y="300" width="1136" height="530" rx="10" class="lam"/>
      <text x="48" y="326" class="t"><tspan class="tbx c-aws">AWS Lambda</tspan><tspan class="t">  ·  container image (ECR) · arm64 Graviton · 2048 MB</tspan></text>

      <!-- Web layer -->
      <g>
        <rect x="334" y="342" width="260" height="70" rx="8" class="sec"/>
        <text x="464" y="364" class="tb" text-anchor="middle">rate limits</text>
        <text x="464" y="382.2" class="t" text-anchor="middle">6/min &amp; 40/h per IP</text>
        <text x="464" y="400.2" class="t" text-anchor="middle">30/min &amp; 1500/day per instance</text>
      </g>
      <g>
        <rect x="618" y="342" width="180" height="70" rx="8" class="app"/>
        <text x="708" y="382" class="tb" text-anchor="middle">FastAPI + Mangum</text>
      </g>
      <g>
        <rect x="822" y="342" width="260" height="70" rx="8" class="sec"/>
        <text x="952" y="364" class="tb" text-anchor="middle">upload limit</text>
        <text x="952" y="382.2" class="t" text-anchor="middle">4 MB / 4096 px</text>
        <text x="952" y="400.2" class="t" text-anchor="middle">in memory, never stored</text>
      </g>

      <!-- Agent loop (hub) -->
      <g>
        <rect x="618" y="446" width="180" height="268" rx="8" class="llm"/>
        <text x="708" y="494" class="tbx c-llm" text-anchor="middle">Agent loop</text>
        <text x="708" y="514" class="t" text-anchor="middle">Converse API, tool use</text>
        <line x1="634" y1="528" x2="782" y2="528" class="div"/>
        <text x="708" y="548" class="ts" text-anchor="middle">tools</text>
        <text x="708" y="568" class="m" text-anchor="middle">capture_snapshot</text>
        <text x="708" y="586" class="m" text-anchor="middle">analyze_frame</text>
        <text x="708" y="604" class="m" text-anchor="middle">improve_view</text>
        <text x="708" y="622" class="m" text-anchor="middle">request_new_snapshot</text>
        <text x="708" y="640" class="m" text-anchor="middle">verify_pass</text>
        <text x="708" y="658" class="m" text-anchor="middle">ask_family</text>
        <text x="708" y="676" class="m" text-anchor="middle">unlock_door</text>
      </g>

      <!-- Deterministic checks and simulated devices (right column) -->
      <g>
        <rect x="918" y="446" width="234" height="92" rx="8" class="sec"/>
        <text x="1035" y="470" class="tb" text-anchor="middle">Pass verifier</text>
        <text x="1035" y="488.2" class="t" text-anchor="middle">Ed25519 · visit window ·</text>
        <text x="1035" y="506.2" class="t" text-anchor="middle">90 s display freshness ·</text>
        <text x="1035" y="524.2" class="t" text-anchor="middle">one-time ledger</text>
      </g>
      <g>
        <rect x="918" y="570" width="234" height="56" rx="8" class="sim"/>
        <text x="1035" y="594" class="tb" text-anchor="middle">Simulated family phone</text>
        <text x="1035" y="612.2" class="t" text-anchor="middle">(HMAC-signed approval)</text>
      </g>
      <g>
        <rect x="918" y="658" width="234" height="56" rx="8" class="sec"/>
        <text x="1035" y="682" class="tb" text-anchor="middle">Unlock guard</text>
        <text x="1035" y="700.2" class="t" text-anchor="middle">(deterministic)</text>
      </g>
      <g>
        <rect x="918" y="750" width="234" height="44" rx="8" class="sim"/>
        <text x="1035" y="777" class="tb" text-anchor="middle">Simulated lock</text>
      </g>
      <text x="858" y="484" class="elm" text-anchor="middle">verify_pass</text>
      <text x="858" y="590" class="elm" text-anchor="middle">ask_family</text>
      <text x="858" y="678" class="elm" text-anchor="middle">unlock_door</text>
      <text x="1045" y="646" class="el">approval</text>
      <text x="1045" y="737" class="el">only if allowed</text>

      <!-- Simulated camera and OpenCV 5 perception (left column) -->
      <g>
        <rect x="278" y="446" width="200" height="56" rx="8" class="sim"/>
        <text x="378" y="470" class="tb" text-anchor="middle">Simulated camera</text>
        <text x="378" y="488.2" class="t" text-anchor="middle">(frame burst)</text>
      </g>
      <text x="548" y="466" class="elm" text-anchor="middle">capture_snapshot</text>
      <text x="410" y="525" class="el" text-anchor="end">frames</text>
      <g id="opencv">
        <rect x="48" y="538" width="430" height="274" rx="10" class="cv"/>
        <text x="60" y="561" class="gl c-cv">OpenCV 5.0.0 perception (analyze_frame)</text>
        <g>
          <rect x="56" y="572" width="414" height="28" rx="6" class="cvs"/>
          <text x="66" y="590.5" class="t"><tspan class="tb c-cv">overlay mask </tspan><tspan class="t">(inpaint)</tspan></text>
        </g>
        <g>
          <rect x="56" y="606" width="414" height="44" rx="6" class="cvs"/>
          <text x="66" y="624.5" class="t"><tspan class="tb c-cv">quality gate: </tspan><tspan class="t">blur (Laplacian var + re-blur ratio),</tspan></text>
          <text x="66" y="641.5" class="t"><tspan class="t">dark, backlight</tspan></text>
        </g>
        <g>
          <rect x="56" y="656" width="414" height="28" rx="6" class="cvs"/>
          <text x="66" y="674.5" class="t"><tspan class="tb c-cv">QR: </tspan><tspan class="t">QRCodeDetectorAruco / QRCodeDetector</tspan></text>
        </g>
        <g>
          <rect x="56" y="690" width="414" height="44" rx="6" class="cvs"/>
          <text x="66" y="708.5" class="t"><tspan class="tb c-cv">text: </tspan><tspan class="t">DNN TextDetectionModel_DB (PP-OCRv3)</tspan></text>
          <text x="66" y="725.5" class="t"><tspan class="t">+ TextRecognitionModel (CRNN)</tspan></text>
        </g>
        <g>
          <rect x="56" y="740" width="414" height="28" rx="6" class="cvs"/>
          <text x="66" y="758.5" class="t"><tspan class="tb c-cv">presence: </tspan><tspan class="t">FaceDetectorYN (YuNet) · no identity</tspan></text>
        </g>
        <g>
          <rect x="56" y="774" width="414" height="28" rx="6" class="cvs"/>
          <text x="66" y="792.5" class="t"><tspan class="tb c-cv">improve_view: </tspan><tspan class="t">CLAHE · gamma · crop+upscale+sharpen</tspan></text>
        </g>
      </g>
      <text x="548" y="596" class="elm" text-anchor="middle">analyze_frame</text>
      <text x="548" y="612" class="elm" text-anchor="middle">improve_view</text>
    </g>

    <!-- Bottom row: ECR, Bedrock, CloudWatch -->
    <g>
      <rect x="32" y="890" width="220" height="72" rx="8" class="aws"/>
      <text x="142" y="922" class="tb" text-anchor="middle">Amazon ECR</text>
      <text x="142" y="940.2" class="t" text-anchor="middle">image, scan on push</text>
    </g>
    <text x="152" y="866" class="el">image</text>
    <g>
      <rect x="548" y="890" width="320" height="72" rx="8" class="llm"/>
      <text x="708" y="922.5" class="tb" text-anchor="middle">Amazon Bedrock · Nova 2 Lite</text>
      <text x="708" y="940" class="m" text-anchor="middle">us.amazon.nova-2-lite-v1:0</text>
    </g>
    <text x="698" y="866" class="el c-llm" text-anchor="end">Converse: measurements + tool results, never pixels</text>
    <g>
      <rect x="918" y="890" width="250" height="72" rx="8" class="aws"/>
      <text x="1043" y="913" class="tb" text-anchor="middle">CloudWatch Logs</text>
      <text x="1043" y="931.2" class="t" text-anchor="middle">JSON-line traces</text>
      <text x="1043" y="949.2" class="t" text-anchor="middle">14-day retention</text>
    </g>
    <text x="1053" y="866" class="el">every step</text>
  </g>

  <!-- Model note -->
  <g>
    <rect x="16" y="1000" width="580" height="56" rx="8" class="cvs"/>
    <text x="306" y="1024" class="tb" text-anchor="middle">OpenCV Zoo models (pinned rev + SHA-256)</text>
    <text x="306" y="1042.2" class="t" text-anchor="middle">YuNet (MIT) · PP-OCRv3 DB (Apache-2.0) · CRNN EN (Apache-2.0)</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <rect x="612" y="1000" width="572" height="56" rx="8" class="note"/>
    <rect x="628" y="1011" width="22" height="13" rx="3" class="cv"/>
    <text x="658" y="1022" class="t">OpenCV 5</text>
    <rect x="848" y="1011" width="22" height="13" rx="3" class="aws"/>
    <text x="878" y="1022" class="t">AWS service</text>
    <rect x="1024" y="1011" width="22" height="13" rx="3" class="llm"/>
    <text x="1054" y="1022" class="t">Agent / LLM</text>
    <rect x="628" y="1034" width="22" height="13" rx="3" class="sec"/>
    <text x="658" y="1045" class="t">Guard / security</text>
    <rect x="848" y="1034" width="22" height="13" rx="3" class="sim"/>
    <text x="878" y="1045" class="t">Simulated</text>
    <rect x="1024" y="1034" width="22" height="13" rx="3" class="app"/>
    <text x="1054" y="1045" class="t">App code</text>
  </g>

  <!-- Footer -->
  <text x="16" y="1086" class="ts">builds on github.com/roshworldwide/homepulse</text>

  <!-- Connectors (drawn last so they sit above container fills) -->
  <g id="connectors">
    <path d="M708,128 V196" class="ar" marker-end="url(#ah)"/>
    <path d="M708,268 V342" class="ar" marker-end="url(#ah)"/>
    <line x1="594" y1="377" x2="618" y2="377" class="ln"/>
    <line x1="798" y1="377" x2="822" y2="377" class="ln"/>
    <path d="M708,412 V446" class="ar" marker-end="url(#ah)"/>
    <path d="M798,492 H918" class="ar" marker-end="url(#ah)"/>
    <path d="M798,598 H918" class="ar" marker-end="url(#ah)"/>
    <path d="M798,686 H918" class="arr" marker-end="url(#ahr)"/>
    <path d="M1035,626 V658" class="ar" marker-end="url(#ah)"/>
    <path d="M1035,714 V750" class="arr" marker-end="url(#ahr)"/>
    <path d="M618,474 H478" class="ar" marker-end="url(#ah)"/>
    <path d="M420,502 V538" class="ar" marker-end="url(#ah)"/>
    <path d="M618,620 H478" class="ar" marker-end="url(#ah)"/>
    <path d="M142,890 V830" class="ar" marker-end="url(#ah)"/>
    <path d="M708,714 V890" class="arp" marker-end="url(#ahp)" marker-start="url(#ahp-s)"/>
    <path d="M1043,830 V890" class="ar" marker-end="url(#ah)"/>
  </g>
</svg>
